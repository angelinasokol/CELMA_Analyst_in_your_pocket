<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CELMA — загрузка отчёта</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Стили полностью повторяют предыдущие, удалены только стили для auth-required-message */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFF4E5;
            color: #3A3A3A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            flex:1;
            display: flex;
            flex-direction: column;
        }
        .processing-header {
            padding: 25px 0;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #FFE0C0;
        }
        .processing-logo { height: 55px; }
        .user-info {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: white;
            padding: 10px 20px;
            border-radius: 40px;
            box-shadow: 0 6px 18px rgba(255,107,53,0.1);
            border:1px solid #FFD9B0;
            z-index:100;
        }
        #userEmail { font-weight:500; color:#FF6B35; }
        #reportsLeft {
            background:#FF8C42; color:white; padding:4px 12px; border-radius:30px;
            font-size:13px; font-weight:600;
        }
        .auth-btn {
            background:#FF8C42; color:white; border:none; padding:8px 20px; border-radius:30px;
            cursor:pointer; font-weight:600; transition:0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .auth-btn:hover { background:#FF6B35; transform:translateY(-2px); }
        #logoutBtn {
            background:#FF6B35; color:white; border:none; padding:8px 20px; border-radius:30px;
            cursor:pointer; display:none;
        }
        .upload-section {
            flex:1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }
        .upload-card {
            background: white;
            border-radius: 40px;
            padding: 50px 40px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(255,107,53,0.1);
            border: 2px dashed #FFD9B0;
            transition: 0.2s;
        }
        .upload-card.dragover {
            border-color: #FF8C42;
            background: #FFF9F0;
            transform: scale(1.01);
        }
        .upload-title {
            font-size: 26px; font-weight:600; color:#FF6B35; margin-bottom:25px;
        }
        .cloud-icon { margin:20px 0; }
        .cloud-icon-img { width:100px; opacity:0.8; }
        .upload-divider {
            height:2px; background: linear-gradient(90deg,transparent,#FFD166,transparent); margin:30px 0;
        }
        .browse-btn {
            background:#FF8C42; color:white; border:none; padding:16px 40px;
            border-radius:50px; font-size:18px; font-weight:600; cursor:pointer;
            box-shadow:0 8px 18px rgba(255,140,66,0.3); transition:0.2s; margin-bottom:20px;
        }
        .browse-btn:hover:not(:disabled) {
            background:#FF6B35; transform:translateY(-3px);
        }
        .browse-btn:disabled { background:#FFD9B0; cursor:not-allowed; box-shadow:none; }
        .upload-info {
            font-size:15px; color:#C0A080; background:#FFF4E5; padding:12px 20px; border-radius:40px;
            display:inline-block;
        }
        .file-input { display:none; }
        .upload-status { margin-top:20px; font-weight:500; min-height:26px; }
        .progress-container { margin-top:25px; display:none; }
        .progress-bar {
            width:100%; height:8px; background:#FFE0C0; border-radius:4px; overflow:hidden;
        }
        .progress-fill {
            height:100%; background:linear-gradient(90deg,#FFD166,#FF8C42); width:0%; transition:width 0.3s;
        }
        .progress-text { margin-top:8px; font-size:14px; color:#FF8C42; }
        .footer {
            display:flex; justify-content:space-between; align-items:center; padding:30px 0;
            border-top:1px solid #FFE0C0; margin-top:40px;
        }
        .footer-left p { color:#8F7A66; font-size:14px; }
        .footer-center .footer-logo { height:45px; opacity:0.8; }
        .footer-right { display:flex; gap:30px; align-items:center; }
        .footer-link { color:#8F7A66; text-decoration:none; font-size:14px; }
        .footer-link:hover { color:#FF8C42; }
        .socials { display:flex; gap:15px; }
        .social-link img {
            width:22px; height:22px; opacity:0.6; transition:0.2s;
            filter: brightness(0) saturate(100%) invert(50%) sepia(50%) saturate(500%) hue-rotate(340deg);
        }
        .social-link:hover img { opacity:1; transform:translateY(-2px); }
        @media (max-width:700px) {
            .user-info { position:static; margin:15px auto; width:fit-content; }
            .footer { flex-direction:column; text-align:center; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <header class="processing-header">
        <img src="images/logo-icon.png" alt="CELMA" class="processing-logo">
    </header>

    <div class="user-info">
        <span id="userEmail"></span>
        <span id="reportsLeft"></span>
        <button id="logoutBtn" style="display:none;">Выйти</button>
        <a href="auth.html?returnUrl=addFile.html" id="authBtn" class="auth-btn">Войти / Регистрация</a>
    </div>

    <section class="upload-section">
        <div class="upload-card" id="uploadCard">
            <h2 class="upload-title">Перетащите файл или нажмите для выбора</h2>
            <div class="cloud-icon"><img src="images/cloud-icon.png" alt="" class="cloud-icon-img"></div>
            <div class="upload-divider"></div>
            <button type="button" id="browseBtn" class="browse-btn">Выбрать файл</button>
            <div class="upload-info">.csv .xlsx .xml • до 10 МБ</div>
            <input type="file" id="fileInput" class="file-input" accept=".csv,.xlsx,.xml">
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText"></div>
            </div>
            <div class="upload-status" id="uploadStatus"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-left"><p>© 2026 Celma</p></div>
        <div class="footer-center"><img src="images/logo-icon.png" alt="" class="footer-logo"></div>
        <div class="footer-right">
            <a href="#" class="footer-link">Конфиденциальность</a>
            <a href="#" class="footer-link">Условия</a>
            <div class="socials">
                <a href="#" class="social-link"><img src="images/tg-icon.png" alt="TG"></a>
                <a href="#" class="social-link"><img src="images/vk-icon.png" alt="VK"></a>
                <a href="#" class="social-link"><img src="images/gmail-icon.png" alt="Email"></a>
            </div>
        </div>
    </footer>
</div>

<script>
(function() {
    const API_URL = "https://friendly-halibut-rjpgrj4pvqq24g4-8000.app.github.dev";
    let currentUser = null;
    let isUploading = false;

    // Проверяем токен при загрузке страницы — если нет, редирект на auth
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'auth.html?returnUrl=addFile.html';
        return; // останавливаем выполнение
    }

    // Если токен есть, загружаем профиль
    fetchUserProfile(token);

    // Элементы
    const userEmail = document.getElementById('userEmail');
    const reportsLeft = document.getElementById('reportsLeft');
    const logoutBtn = document.getElementById('logoutBtn');
    const authBtn = document.getElementById('authBtn');
    const uploadCard = document.getElementById('uploadCard');
    const fileInput = document.getElementById('fileInput');
    const browseBtn = document.getElementById('browseBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    async function fetchUserProfile(token) {
        try {
            const res = await fetch(`${API_URL}/auth/me`, { headers:{'Authorization':`Bearer ${token}`} });
            if (!res.ok) throw new Error();
            currentUser = await res.json();
            updateUI();
        } catch {
            localStorage.removeItem('token');
            window.location.href = 'auth.html?returnUrl=addFile.html';
        }
    }

    function updateUI() {
        if (currentUser) {
            userEmail.textContent = currentUser.email;
            reportsLeft.textContent = `📊 ${currentUser.reports_left}/${currentUser.reports_limit}`;
            logoutBtn.style.display = 'block';
            authBtn.style.display = 'none';
        } else {
            userEmail.textContent = '';
            reportsLeft.textContent = '';
            logoutBtn.style.display = 'none';
            authBtn.style.display = 'inline-block';
        }
    }

    logoutBtn?.addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = 'auth.html?returnUrl=addFile.html';
    });

    // Загрузка файла
    async function handleFileUpload(file) {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'auth.html?returnUrl=addFile.html';
            return;
        }

        if (file.size > 10*1024*1024) {
            showStatus('❌ Файл больше 10 МБ', '#d32f2f');
            return;
        }
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['csv','xlsx','xml'].includes(ext)) {
            showStatus('❌ Неподдерживаемый формат', '#d32f2f');
            return;
        }

        sessionStorage.removeItem('celma_file_id');
        sessionStorage.removeItem('celma_analytics');
        isUploading = true;
        browseBtn.disabled = true;

        progressContainer.style.display = 'block';
        progressFill.style.width = '20%';
        progressText.textContent = 'Подготовка...';
        showStatus('📤 Загрузка...', '#FF8C42');

        try {
            const formData = new FormData();
            formData.append('file', file);
            progressFill.style.width = '50%'; progressText.textContent = 'Отправка...';
            const res = await fetch(`${API_URL}/upload/`, {
                method:'POST', headers:{'Authorization':`Bearer ${token}`}, body:formData
            });
            progressFill.style.width = '80%'; progressText.textContent = 'Обработка...';
            if (res.status === 429) {
                const err = await res.json();
                alert(`Лимит: ${err.detail}`);
                return;
            }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            progressFill.style.width = '100%'; progressText.textContent = 'Готово!';
            sessionStorage.setItem('celma_file_id', data.file_id);
            showStatus('✅ Файл загружен! Переход...', '#4CAF50');
            setTimeout(() => window.location.href = 'processing.html', 800);
        } catch(err) {
            console.error(err);
            progressContainer.style.display = 'none';
            showStatus('❌ Ошибка загрузки', '#d32f2f');
        } finally {
            isUploading = false;
            browseBtn.disabled = false;
        }
    }

    function showStatus(text, color) { uploadStatus && (uploadStatus.textContent = text, uploadStatus.style.color = color); }

    // Инициализация drag & drop
    function initUpload() {
        uploadCard.addEventListener('click', e => {
            if (!localStorage.getItem('token')) {
                window.location.href = 'auth.html?returnUrl=addFile.html';
                return;
            }
            if (!e.target.closest('button') && e.target !== fileInput) fileInput.click();
        });

        browseBtn?.addEventListener('click', e => {
            e.preventDefault();
            if (!localStorage.getItem('token')) {
                window.location.href = 'auth.html?returnUrl=addFile.html';
                return;
            }
            fileInput.click();
        });

        uploadCard.addEventListener('dragover', e => {
            e.preventDefault();
            if (localStorage.getItem('token')) uploadCard.classList.add('dragover');
        });
        uploadCard.addEventListener('dragleave', e => {
            e.preventDefault();
            uploadCard.classList.remove('dragover');
        });
        uploadCard.addEventListener('drop', e => {
            e.preventDefault();
            uploadCard.classList.remove('dragover');
            if (!localStorage.getItem('token')) {
                window.location.href = 'auth.html?returnUrl=addFile.html';
                return;
            }
            if (e.dataTransfer.files?.length) handleFileUpload(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', e => {
            if (!localStorage.getItem('token')) {
                window.location.href = 'auth.html?returnUrl=addFile.html';
                return;
            }
            if (fileInput.files?.length) handleFileUpload(fileInput.files[0]);
            fileInput.value = '';
        });
    }

    document.addEventListener('DOMContentLoaded', initUpload);
})();
</script>
</body>
</html>
