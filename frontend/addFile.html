<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CELMA — карманный аналитик</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style_addFile.css">
</head>
<body>
<div class="wrapper">

    <header class="processing-header">
        <img src="images/logo-icon.png" alt="CELMA" class="processing-logo">
    </header>

    <!-- Индикатор пользователя в шапке -->
    <div class="user-info">
        <span id="userEmail"></span>
        <span id="reportsLeft"></span>
        <button id="authBtn" class="auth-btn">Войти</button>
        <button id="logoutBtn" style="display: none;">Выйти</button>
    </div>

    <section class="upload-section">
        <div class="upload-card">
            <h2 class="upload-title">Перетащите файл сюда или нажмите, чтобы выбрать файл</h2>
            <div class="cloud-icon">
                <img src="images/cloud-icon.png" alt="Upload" class="cloud-icon-img">
            </div>
            <div class="upload-divider"></div>
            <button type="button" id="browseBtn" class="browse-btn">Browse File</button>
            <div class="upload-info">
                Поддерживаются форматы: .csv .xlsx .xml<br>
                Максимальный размер файла: 10 МБ
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".csv,.xlsx,.xml">
            <div class="upload-status" id="uploadStatus"></div>
        </div>
    </section>

    <section class="result-section">
        <h2 class="result-title">ПРИМЕР РЕЗУЛЬТАТА</h2>

        <div class="slider-container">
            <div class="slider">
                <div class="slide active">
                    <img src="images/result-1.png" alt="Пример результата - страница 1" class="result-image">
                </div>
                <div class="slide">
                    <img src="images/result-2.png" alt="Пример результата - страница 2" class="result-image">
                </div>
                <div class="slide">
                    <img src="images/result-3.png" alt="Пример результата - страница 3" class="result-image">
                </div>
                <div class="slide">
                    <img src="images/result-4.png" alt="Пример результата - страница 4" class="result-image">
                </div>
                <div class="slide">
                    <img src="images/result-5.png" alt="Пример результата - страница 5" class="result-image">
                </div>
            </div>

            <button class="slider-arrow prev" aria-label="Предыдущий пример">
                <img src="images/arrow-left.png" alt="Previous">
            </button>
            <button class="slider-arrow next" aria-label="Следующий пример">
                <img src="images/arrow-right.png" alt="Next">
            </button>

            <div class="slider-dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
                <span class="dot" data-index="3"></span>
                <span class="dot" data-index="4"></span>
            </div>

            <div class="slide-counter">
                <span class="current-slide">1</span> / <span class="total-slides">5</span>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-left">
            <p>© 2026 Celma Все права защищены.</p>
        </div>
        <div class="footer-center">
            <img src="images/logo-icon.png" alt="" class="footer-logo">
        </div>
        <div class="footer-right">
            <a href="#" class="footer-link">Конфиденциальность</a>
            <a href="#" class="footer-link">Условия</a>
            <div class="socials">
                <a href="#" class="social-link" aria-label="Telegram"><img src="images/tg-icon.png" alt=""></a>
                <a href="#" class="social-link" aria-label="VK"><img src="images/vk-icon.png" alt=""></a>
                <a href="#" class="social-link" aria-label="Mail"><img src="images/gmail-icon.png" alt=""></a>
            </div>
        </div>
    </footer>
</div>

<!-- Модальное окно для входа/регистрации -->
<div id="authModal" class="auth-modal" style="display: none;">
    <div class="auth-modal-content">
        <span class="auth-close">&times;</span>
        <h2 id="authTitle">Вход в аккаунт</h2>
        
        <form id="authForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit" id="authSubmit">Войти</button>
        </form>
        
        <p id="authToggle">
            Нет аккаунта? <a href="#" id="switchToRegister">Зарегистрироваться</a>
        </p>
    </div>
</div>

<script>
(function() {
    // === КОНФИГУРАЦИЯ ===
    const API_URL = "https://friendly-halibut-rjpgrj4pvqq24g4-8000.app.github.dev"; // ЗАМЕНИТЕ НА СВОЙ URL
    let currentUser = null;

    // === DOM ЭЛЕМЕНТЫ ===
    const authBtn = document.getElementById('authBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');
    const reportsLeft = document.getElementById('reportsLeft');
    const authModal = document.getElementById('authModal');
    const authClose = document.querySelector('.auth-close');
    const authTitle = document.getElementById('authTitle');
    const authForm = document.getElementById('authForm');
    const authSubmit = document.getElementById('authSubmit');
    const authToggle = document.getElementById('authToggle');
    const switchToRegister = document.getElementById('switchToRegister');
    const uploadCard = document.querySelector(".upload-card");
    const fileInput = document.getElementById("fileInput");
    const browseBtn = document.getElementById("browseBtn");
    const uploadStatus = document.getElementById("uploadStatus");

    let isLoginMode = true;

    // === СЛАЙДЕР ===
    function initSlider() {
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.querySelector('.slider-arrow.prev');
        const nextBtn = document.querySelector('.slider-arrow.next');
        const dots = document.querySelectorAll('.dot');
        const currentSpan = document.querySelector('.current-slide');
        const totalSpan = document.querySelector('.total-slides');

        if (!slides.length || !prevBtn || !nextBtn) return;

        let currentIndex = 0;
        const totalSlides = slides.length;
        if (totalSpan) totalSpan.textContent = totalSlides;

        function updateSlider() {
            slides.forEach((slide, idx) => {
                slide.classList.toggle('active', idx === currentIndex);
            });
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentIndex);
            });
            if (currentSpan) currentSpan.textContent = currentIndex + 1;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % totalSlides;
            updateSlider();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            updateSlider();
        }

        function goToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                currentIndex = index;
                updateSlider();
            }
        }

        nextBtn.addEventListener('click', (e) => {
            e.preventDefault();
            nextSlide();
        });

        prevBtn.addEventListener('click', (e) => {
            e.preventDefault();
            prevSlide();
        });

        dots.forEach((dot, idx) => {
            dot.addEventListener('click', () => goToSlide(idx));
        });

        updateSlider();
    }

    // === АУТЕНТИФИКАЦИЯ ===
    
    // Проверяем сохраненный токен
    const token = localStorage.getItem('token');
    if (token) {
        fetchUserProfile(token);
    }

    // Открыть модалку
    if (authBtn) {
        authBtn.addEventListener('click', () => {
            authModal.style.display = 'flex';
        });
    }

    // Закрыть модалку
    if (authClose) {
        authClose.addEventListener('click', () => {
            authModal.style.display = 'none';
        });
    }

    window.addEventListener('click', (e) => {
        if (e.target === authModal) {
            authModal.style.display = 'none';
        }
    });

    // Переключение между логином и регистрацией
    if (switchToRegister) {
        switchToRegister.addEventListener('click', (e) => {
            e.preventDefault();
            toggleAuthMode();
        });
    }

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            authTitle.textContent = 'Вход в аккаунт';
            authSubmit.textContent = 'Войти';
            authToggle.innerHTML = 'Нет аккаунта? <a href="#" id="switchToRegister">Зарегистрироваться</a>';
        } else {
            authTitle.textContent = 'Регистрация';
            authSubmit.textContent = 'Зарегистрироваться';
            authToggle.innerHTML = 'Уже есть аккаунт? <a href="#" id="switchToRegister">Войти</a>';
        }
        document.getElementById('switchToRegister').addEventListener('click', (e) => {
            e.preventDefault();
            toggleAuthMode();
        });
    }

    // Обработка формы
    if (authForm) {
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
            
            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) throw new Error('Ошибка авторизации');
                
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                
                authModal.style.display = 'none';
                fetchUserProfile(data.access_token);
                
                // Очистить форму
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        });
    }

    // Выход
    if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('token');
            currentUser = null;
            updateUI();
        });
    }

    // Получение профиля пользователя
    async function fetchUserProfile(token) {
        try {
            const response = await fetch(`${API_URL}/auth/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (!response.ok) throw new Error('Не удалось загрузить профиль');
            
            currentUser = await response.json();
            updateUI();
            
        } catch (error) {
            console.error('Ошибка профиля:', error);
            localStorage.removeItem('token');
        }
    }

    // Обновление интерфейса
    function updateUI() {
        if (currentUser) {
            userEmail.textContent = currentUser.email;
            reportsLeft.textContent = `📊 ${currentUser.reports_left} из 10`;
            authBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
        } else {
            userEmail.textContent = '';
            reportsLeft.textContent = '';
            authBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
        }
    }

    // === ЗАГРУЗКА ФАЙЛОВ ===
    function initFileUpload() {
        if (!uploadCard || !fileInput) return;

        // Блокировка всех форм
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => e.preventDefault());
        });

        // Клик по карточке
        uploadCard.addEventListener("click", (e) => {
            if (e.target !== browseBtn && e.target !== fileInput) {
                fileInput.click();
            }
        });

        if (browseBtn) {
            browseBtn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                fileInput.click();
            });
        }

        // Drag & Drop
        uploadCard.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadCard.classList.add("dragover");
        });
        uploadCard.addEventListener("dragleave", (e) => {
            e.preventDefault();
            uploadCard.classList.remove("dragover");
        });
        uploadCard.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadCard.classList.remove("dragover");
            if (e.dataTransfer.files.length) {
                handleFileWithToken(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener("change", (e) => {
            if (fileInput.files.length > 0) {
                handleFileWithToken(fileInput.files[0]);
            }
            fileInput.value = '';
        });

        async function handleFileWithToken(file) {
            const token = localStorage.getItem('token');
            
            // Проверка авторизации
            if (!token) {
                alert('Сначала войдите в систему');
                authModal.style.display = 'flex';
                return;
            }

            // Проверка размера
            const maxSize = 10 * 1024 * 1024;
            if (file.size > maxSize) {
                showStatus("❌ Файл слишком большой. Максимум 10 МБ.", "#d32f2f");
                return;
            }

            // Проверка формата
            const allowed = ['.csv', '.xlsx', '.xml'];
            const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
            if (!allowed.includes(ext)) {
                showStatus("❌ Неподдерживаемый формат. Используйте .csv, .xlsx или .xml.", "#d32f2f");
                return;
            }

            showStatus("📤 Загрузка файла...", "#2196F3");

            try {
                const formData = new FormData();
                formData.append("file", file);

                const uploadResponse = await fetch(`${API_URL}/upload/`, {
                    method: "POST",
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (uploadResponse.status === 401) {
                    alert('Сессия истекла. Войдите снова.');
                    localStorage.removeItem('token');
                    authModal.style.display = 'flex';
                    return;
                }

                if (uploadResponse.status === 429) {
                    alert('Достигнут лимит отчетов на сегодня (10/10)');
                    return;
                }

                if (!uploadResponse.ok) throw new Error(`Ошибка HTTP: ${uploadResponse.status}`);

                const uploadResult = await uploadResponse.json();
                const fileId = uploadResult.file_id;
                console.log("✅ Файл загружен, ID:", fileId);

                sessionStorage.setItem("celma_file_id", fileId);
                showStatus("✅ Файл принят! Запускаем анализ...", "#2E7D32");

                setTimeout(() => {
                    window.location.href = "processing.html";
                }, 500);

            } catch (error) {
                console.error("💥 Ошибка:", error);
                if (confirm("Не удалось связаться с сервером. Использовать демо-режим?")) {
                    const mockFileId = "demo_" + Date.now();
                    sessionStorage.setItem("celma_file_id", mockFileId);
                    showStatus("🧪 Демо-режим: файл не отправлен, но анализ будет показан", "#FF9800");
                    setTimeout(() => {
                        window.location.href = "processing.html";
                    }, 800);
                } else {
                    showStatus("❌ " + error.message, "#d32f2f");
                }
            }
        }

        function showStatus(text, color) {
            if (uploadStatus) {
                uploadStatus.textContent = text;
                uploadStatus.style.color = color;
            }
        }
    }

    // === ЗАПУСК ===
    document.addEventListener("DOMContentLoaded", () => {
        initSlider();
        initFileUpload();
    });
})();
</script>
</body>
</html>
