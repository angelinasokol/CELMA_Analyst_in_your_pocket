<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CELMA — анализ данных</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFF4E5;
            color: #3A3A3A;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .processing-header {
            padding: 30px 0;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #FFE0C0;
        }
        .processing-logo { height: 60px; }
        .processing-section {
            flex:1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .processing-card {
            background: white;
            border-radius: 40px;
            padding: 50px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(255,107,53,0.1);
            border: 1px solid #FFD9B0;
        }
        .processing-card h2 {
            font-size: 26px; font-weight:600; color:#FF6B35; margin-bottom:30px;
        }
        .ai-brain {
            width: 90px; height:90px; background:#FF8C42; border-radius:50%;
            margin:0 auto 30px; display:flex; align-items:center; justify-content:center;
            color:white; font-size:40px; animation:pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform:scale(0.95); box-shadow:0 0 0 0 rgba(255,140,66,0.4); }
            50% { transform:scale(1.1); box-shadow:0 0 0 20px rgba(255,140,66,0); }
            100% { transform:scale(0.95); box-shadow:0 0 0 0 rgba(255,140,66,0); }
        }
        .steps-container { text-align:left; margin-top:20px; }
        .step-item {
            display:flex; align-items:center; margin:18px 0; opacity:0.3; transition:0.5s;
        }
        .step-item.active { opacity:1; transform:translateX(10px); }
        .step-icon {
            width:28px; height:28px; border-radius:50%; background:#FFE0C0; margin-right:15px;
            display:flex; align-items:center; justify-content:center; font-size:14px; color:#6B5A4A;
        }
        .step-item.active .step-icon { background:#FF8C42; color:white; }
        .step-text { font-size:16px; font-weight:500; color:#5C4E3D; }
        .progress-bar {
            height:8px; background:#FFE0C0; border-radius:10px; margin:30px 0 15px; overflow:hidden;
        }
        .progress-fill {
            height:100%; background:linear-gradient(90deg,#FFD166,#FF8C42); width:0%; transition:width 0.5s;
        }
        .status-text { margin-top:10px; font-size:15px; color:#FF8C42; font-style:italic; }
        .error-message {
            color:#d32f2f; margin-top:15px; padding:10px; background:rgba(211,47,47,0.05);
            border-radius:8px; display:none;
        }
    </style>
</head>
<body>
<header class="processing-header">
    <img src="images/logo-icon.png" alt="CELMA" class="processing-logo">
</header>

<section class="processing-section">
    <div class="processing-card">
        <div class="ai-brain">🧠</div>
        <h2 id="main-title">Анализируем ваш отчёт</h2>

        <div class="steps-container">
            <div class="step-item" id="step1"><div class="step-icon">1</div><div class="step-text">Загрузка в нейросеть...</div></div>
            <div class="step-item" id="step2"><div class="step-icon">2</div><div class="step-text">Поиск паттернов...</div></div>
            <div class="step-item" id="step3"><div class="step-icon">3</div><div class="step-text">Построение прогнозов...</div></div>
            <div class="step-item" id="step4"><div class="step-icon">4</div><div class="step-text">Формирование рекомендаций...</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="status-text" id="statusText">Инициализация...</div>
        <div class="error-message" id="errorMessage"></div>
    </div>
</section>

<script>
(function() {
    const API_URL = "https://friendly-halibut-rjpgrj4pvqq24g4-8000.app.github.dev";
    document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem('token');
        const fileId = sessionStorage.getItem('celma_file_id');
        const mainTitle = document.getElementById('main-title');
        const statusText = document.getElementById('statusText');
        const errorMessage = document.getElementById('errorMessage');
        const progressFill = document.getElementById('progressFill');

        if (!token) {
            errorMessage.style.display = 'block';
            errorMessage.textContent = 'Не авторизованы. Перенаправление...';
            setTimeout(() => window.location.href = 'addFile.html', 2000);
            return;
        }
        if (!fileId) {
            errorMessage.style.display = 'block';
            errorMessage.textContent = 'Нет файла для анализа.';
            setTimeout(() => window.location.href = 'addFile.html', 2000);
            return;
        }

        let analyticsData = null;
        let retryCount = 0;
        const MAX_RETRIES = 3;
        const RETRY_DELAY = 1000;

        async function fetchAnalytics() {
            while (retryCount < MAX_RETRIES) {
                try {
                    statusText.textContent = `Попытка ${retryCount+1}/${MAX_RETRIES}...`;
                    const res = await fetch(`${API_URL}/analytics/${fileId}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                    });
                    if (res.status === 401) throw new Error('Сессия истекла');
                    if (res.status === 404) {
                        statusText.textContent = 'Файл обрабатывается...';
                        await new Promise(r => setTimeout(r, RETRY_DELAY));
                        retryCount++;
                        continue;
                    }
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    analyticsData = { ...data, filename: data.filename || 'Отчёт', fileId };
                    sessionStorage.setItem('celma_analytics', JSON.stringify(analyticsData));
                    return true;
                } catch (err) {
                    console.error(err);
                    if (err.message.includes('Сессия истекла')) {
                        errorMessage.textContent = 'Сессия истекла. Войдите снова.';
                        localStorage.removeItem('token');
                        setTimeout(() => window.location.href = 'addFile.html', 2000);
                        return false;
                    }
                    retryCount++;
                    if (retryCount < MAX_RETRIES) {
                        statusText.textContent = `Ошибка, повтор...`;
                        await new Promise(r => setTimeout(r, RETRY_DELAY));
                    }
                }
            }
            analyticsData = { filename: 'демо-файл', summary: 'Демо-данные', fileId, isDemo: true };
            sessionStorage.setItem('celma_analytics', JSON.stringify(analyticsData));
            return true;
        }

        const steps = [
            { id:'step1', text:'Чтение данных...' },
            { id:'step2', text:'Анализ трендов...' },
            { id:'step3', text:'Расчёт KPI...' },
            { id:'step4', text:'Формирование выводов...' }
        ];
        let currentStep = 0;

        function runStep() {
            if (currentStep < steps.length) {
                document.querySelectorAll('.step-item').forEach(el => el.classList.remove('active'));
                document.getElementById(steps[currentStep].id)?.classList.add('active');
                statusText.textContent = steps[currentStep].text;
                progressFill.style.width = `${((currentStep+1)/steps.length)*100}%`;
                currentStep++;
                setTimeout(runStep, 1200);
            } else {
                statusText.textContent = 'Завершение...';
            }
        }
        setTimeout(runStep, 500);

        const success = await fetchAnalytics();
        if (success) {
            statusText.textContent = analyticsData.isDemo ? '⚠️ Демо-режим' : '✅ Анализ завершён!';
            progressFill.style.width = '100%';
            setTimeout(() => window.location.href = 'dashboard.html', 1000);
        }
    });
})();
</script>
</body>
</html>
