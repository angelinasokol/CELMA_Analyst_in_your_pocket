<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CELMA — Анализ данных</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #EDE7DA;
            color: #2E2E2E;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .processing-header {
            padding: 30px 0;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .processing-logo { height: 60px; }
        
        .processing-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .processing-card {
            background-color: #D9CFB8;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .processing-card h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #2E2E2E;
        }

        .ai-brain {
            width: 80px;
            height: 80px;
            background: #2E2E2E;
            border-radius: 50%;
            margin: 0 auto 30px;
            position: relative;
            animation: pulse 1.5s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 30px;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 46, 46, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(46, 46, 46, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 46, 46, 0); }
        }

        .steps-container {
            text-align: left;
            margin-top: 20px;
        }

        .step-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            opacity: 0.3;
            transition: all 0.5s ease;
        }

        .step-item.active {
            opacity: 1;
            transform: translateX(10px);
        }

        .step-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            transition: background 0.3s;
        }

        .step-item.active .step-icon {
            background: #2E2E2E;
        }

        .step-text {
            font-size: 15px;
            font-weight: 500;
        }

        .progress-bar {
            height: 6px;
            background: #ccc;
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2E2E2E;
            transition: width 0.5s ease;
        }
        
        .status-text {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

<header class="processing-header">
    <img src="images/logo-icon.png" alt="CELMA" class="processing-logo">
</header>

<section class="processing-section">
    <div class="processing-card">
        <div class="ai-brain">🧠</div>
        <h2 id="main-title">Анализируем ваш отчёт</h2>

        <div class="steps-container">
            <div class="step-item" id="step1">
                <div class="step-icon">1</div>
                <div class="step-text">Загрузка данных в нейросеть...</div>
            </div>
            <div class="step-item" id="step2">
                <div class="step-icon">2</div>
                <div class="step-text">Распознавание паттернов и аномалий...</div>
            </div>
            <div class="step-item" id="step3">
                <div class="step-icon">3</div>
                <div class="step-text">Построение прогнозов и дашбордов...</div>
            </div>
            <div class="step-item" id="step4">
                <div class="step-icon">4</div>
                <div class="step-text">Формирование рекомендаций...</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="status-text" id="statusText">Инициализация...</div>
    </div>
</section>

<script>
    (function() {
        document.addEventListener("DOMContentLoaded", () => {
            // ⚠️ ЗАМЕНИТЕ НА ВАШ АКТУАЛЬНЫЙ API_URL
            const API_URL = "https://friendly-halibut-rjpgrj4pvqq24g4-8000.app.github.dev";
            const fileId = sessionStorage.getItem('celma_file_id');
            const mainTitle = document.getElementById('main-title');
            const statusText = document.getElementById('statusText');

            if (!fileId) {
                mainTitle.textContent = "❌ Ошибка: нет данных для анализа";
                statusText.textContent = "Вы не загрузили файл. Перенаправление...";
                setTimeout(() => window.location.href = 'addFile.html', 3000);
                return;
            }

            console.log("🧠 Анализ для file_id:", fileId);

            let analyticsData = null;
            let analyticsError = null;

            // Запрос к API
            fetch(`${API_URL}/analytics/${fileId}`, { method: "POST" })
                .then(response => {
                    if (!response.ok) throw new Error(`Ошибка HTTP: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    console.log("📊 Данные аналитики получены:", data);
                    analyticsData = data;
                    if (!analyticsData.filename) analyticsData.filename = "Отчёт";
                    sessionStorage.setItem('celma_analytics', JSON.stringify(analyticsData));
                })
                .catch(error => {
                    console.error("💥 Ошибка получения аналитики:", error);
                    analyticsError = error.message;
                    statusText.textContent = "⚠️ Ошибка анализа, но мы покажем демо-данные";
                    analyticsData = { 
                        filename: "демо-файл", 
                        summary: "Не удалось загрузить реальные данные. Показан пример.",
                        charts: [],
                        forecast: {}
                    };
                    sessionStorage.setItem('celma_analytics', JSON.stringify(analyticsData));
                });

            // Анимация шагов
            const steps = [
                { id: 'step1', text: 'Чтение строк и колонок...' },
                { id: 'step2', text: 'Поиск сезонных трендов...' },
                { id: 'step3', text: 'Расчет ключевых показателей (KPI)...' },
                { id: 'step4', text: 'Генерация инсайтов...' }
            ];

            let currentStep = 0;
            const progressFill = document.getElementById('progressFill');
            const totalSteps = steps.length;

            function runStep() {
                if (currentStep < totalSteps) {
                    document.querySelectorAll('.step-item').forEach(el => el.classList.remove('active'));
                    const activeStep = document.getElementById(steps[currentStep].id);
                    if (activeStep) activeStep.classList.add('active');
                    statusText.textContent = steps[currentStep].text;
                    progressFill.style.width = `${((currentStep + 1) / totalSteps) * 100}%`;
                    currentStep++;
                    setTimeout(runStep, 1200);
                } else {
                    statusText.textContent = "⏳ Завершаем анализ...";

                    const waitForData = setInterval(() => {
                        if (analyticsData !== null || analyticsError) {
                            clearInterval(waitForData);
                            if (analyticsError) {
                                statusText.textContent = "❌ Ошибка анализа, но мы покажем демо";
                            } else {
                                statusText.textContent = "✅ Анализ завершён! Переход к результатам...";
                            }
                            progressFill.style.width = '100%';
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 800);
                        }
                    }, 200);

                    setTimeout(() => {
                        clearInterval(waitForData);
                        if (!analyticsData && !analyticsError) {
                            statusText.textContent = "⚠️ Тайм-аут, переходим к демо";
                            analyticsData = { filename: "демо (тайм-аут)" };
                            sessionStorage.setItem('celma_analytics', JSON.stringify(analyticsData));
                            setTimeout(() => window.location.href = 'dashboard.html', 1000);
                        }
                    }, 5000);
                }
            }

            setTimeout(runStep, 500);
        });
    })();
</script>
</body>
</html>
