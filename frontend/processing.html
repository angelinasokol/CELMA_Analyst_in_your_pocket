<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CELMA — Анализ данных</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #EDE7DA;
            color: #2E2E2E;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .processing-header {
            padding: 30px 0;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .processing-logo { height: 60px; }
        
        .processing-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .processing-card {
            background-color: #D9CFB8;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .processing-card h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #2E2E2E;
        }

        .ai-brain {
            width: 80px;
            height: 80px;
            background: #2E2E2E;
            border-radius: 50%;
            margin: 0 auto 30px;
            position: relative;
            animation: pulse 1.5s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 30px;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 46, 46, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(46, 46, 46, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 46, 46, 0); }
        }

        .steps-container {
            text-align: left;
            margin-top: 20px;
        }

        .step-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            opacity: 0.3;
            transition: all 0.5s ease;
        }

        .step-item.active {
            opacity: 1;
            transform: translateX(10px);
        }

        .step-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            transition: background 0.3s;
        }

        .step-item.active .step-icon {
            background: #2E2E2E;
        }

        .step-text {
            font-size: 15px;
            font-weight: 500;
        }

        .progress-bar {
            height: 6px;
            background: #ccc;
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2E2E2E;
            transition: width 0.5s ease;
        }
        
        .status-text {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            font-style: italic;
        }

        .error-message {
            color: #d32f2f;
            margin-top: 15px;
            padding: 10px;
            background: rgba(211, 47, 47, 0.1);
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<header class="processing-header">
    <img src="images/logo-icon.png" alt="CELMA" class="processing-logo">
</header>

<section class="processing-section">
    <div class="processing-card">
        <div class="ai-brain">🧠</div>
        <h2 id="main-title">Анализируем ваш отчёт</h2>

        <div class="steps-container">
            <div class="step-item" id="step1">
                <div class="step-icon">1</div>
                <div class="step-text">Загрузка данных в нейросеть...</div>
            </div>
            <div class="step-item" id="step2">
                <div class="step-icon">2</div>
                <div class="step-text">Распознавание паттернов и аномалий...</div>
            </div>
            <div class="step-item" id="step3">
                <div class="step-icon">3</div>
                <div class="step-text">Построение прогнозов и дашбордов...</div>
            </div>
            <div class="step-item" id="step4">
                <div class="step-icon">4</div>
                <div class="step-text">Формирование рекомендаций...</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="status-text" id="statusText">Инициализация...</div>
        <div class="error-message" id="errorMessage"></div>
    </div>
</section>

<script>
(function() {
    // Конфигурация
    const API_URL = "https://friendly-halibut-rjpgrj4pvqq24g4-8000.app.github.dev";
    const MAX_RETRIES = 3;
    const RETRY_DELAY = 1000;
    
    document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem('token');
        const fileId = sessionStorage.getItem('celma_file_id');
        
        const mainTitle = document.getElementById('main-title');
        const statusText = document.getElementById('statusText');
        const errorMessage = document.getElementById('errorMessage');
        const progressFill = document.getElementById('progressFill');

        // Проверка авторизации
        if (!token) {
            showError('Не авторизованы. Перенаправление...');
            setTimeout(() => window.location.href = 'addFile.html', 2000);
            return;
        }

        if (!fileId) {
            showError('Нет файла для анализа. Перенаправление...');
            setTimeout(() => window.location.href = 'addFile.html', 2000);
            return;
        }

        console.log("🧠 Анализ для file_id:", fileId);
        console.log("🔑 Токен:", token ? "есть" : "нет");

        // Очищаем старые данные перед новым анализом
        sessionStorage.removeItem('celma_analytics');
        
        let analyticsData = null;
        let analyticsError = null;
        let retryCount = 0;

        // Функция для показа ошибок
        function showError(msg) {
            errorMessage.style.display = 'block';
            errorMessage.textContent = msg;
            statusText.textContent = '❌ ' + msg;
        }

        // Функция запроса аналитики с повторными попытками
        async function fetchAnalyticsWithRetry() {
            while (retryCount < MAX_RETRIES) {
                try {
                    statusText.textContent = `Попытка анализа ${retryCount + 1}/${MAX_RETRIES}...`;
                    
                    const response = await fetch(`${API_URL}/analytics/${fileId}`, { 
                        method: "POST",
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.status === 401) {
                        throw new Error('Сессия истекла. Войдите снова');
                    }
                    
                    if (response.status === 404) {
                        // Файл еще не готов - ждем и пробуем снова
                        statusText.textContent = 'Файл обрабатывается сервером...';
                        await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
                        retryCount++;
                        continue;
                    }
                    
                    if (!response.ok) {
                        throw new Error(`Ошибка HTTP: ${response.status}`);
                    }

                    const data = await response.json();
                    console.log("📊 Данные аналитики получены:", data);
                    
                    // Сохраняем данные
                    analyticsData = {
                        ...data,
                        filename: data.filename || "Отчёт",
                        timestamp: new Date().toISOString(),
                        fileId: fileId
                    };
                    
                    sessionStorage.setItem('celma_analytics', JSON.stringify(analyticsData));
                    return true; // Успех

                } catch (error) {
                    console.error("💥 Ошибка получения аналитики:", error);
                    
                    if (error.message.includes('Сессия истекла')) {
                        showError('Сессия истекла. Перенаправление...');
                        localStorage.removeItem('token');
                        setTimeout(() => window.location.href = 'addFile.html', 2000);
                        return false;
                    }

                    retryCount++;
                    
                    if (retryCount < MAX_RETRIES) {
                        statusText.textContent = `Ошибка, повтор через ${RETRY_DELAY/1000}с...`;
                        await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
                    }
                }
            }
            
            // Если все попытки неудачны - создаем демо-данные
            analyticsData = { 
                filename: "демо-файл", 
                summary: "Не удалось загрузить реальные данные. Показан пример.",
                charts: [],
                forecast: {},
                fileId: fileId,
                isDemo: true
            };
            sessionStorage.setItem('celma_analytics', JSON.stringify(analyticsData));
            return true;
        }

        // Анимация шагов
        const steps = [
            { id: 'step1', text: 'Чтение строк и колонок...' },
            { id: 'step2', text: 'Поиск сезонных трендов...' },
            { id: 'step3', text: 'Расчет ключевых показателей (KPI)...' },
            { id: 'step4', text: 'Генерация инсайтов...' }
        ];

        let currentStep = 0;
        const totalSteps = steps.length;

        // Запускаем анимацию и запрос параллельно
        const analyticsPromise = fetchAnalyticsWithRetry();
        
        function runStep() {
            if (currentStep < totalSteps) {
                document.querySelectorAll('.step-item').forEach(el => el.classList.remove('active'));
                const activeStep = document.getElementById(steps[currentStep].id);
                if (activeStep) activeStep.classList.add('active');
                statusText.textContent = steps[currentStep].text;
                progressFill.style.width = `${((currentStep + 1) / totalSteps) * 100}%`;
                currentStep++;
                setTimeout(runStep, 1200);
            } else {
                statusText.textContent = "⏳ Завершаем анализ...";
            }
        }

        setTimeout(runStep, 500);

        // Ждем завершения анализа
        const success = await analyticsPromise;
        
        if (success) {
            statusText.textContent = analyticsData.isDemo 
                ? "⚠️ Демо-режим: показаны примеры данных"
                : "✅ Анализ завершён! Переход к результатам...";
            
            progressFill.style.width = '100%';
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        }
    });
})();
</script>
</body>
</html>
