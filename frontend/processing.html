<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CELMA — Анализ данных</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #EDE7DA;
            color: #2E2E2E;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .processing-header {
            padding: 30px 0;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .processing-logo { height: 60px; }
        
        .processing-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .processing-card {
            background-color: #D9CFB8;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .processing-card h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #2E2E2E;
        }

        /* Анимация пульсации */
        .ai-brain {
            width: 80px;
            height: 80px;
            background: #2E2E2E;
            border-radius: 50%;
            margin: 0 auto 30px;
            position: relative;
            animation: pulse 1.5s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 30px;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 46, 46, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(46, 46, 46, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 46, 46, 0); }
        }

        .steps-container {
            text-align: left;
            margin-top: 20px;
        }

        .step-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            opacity: 0.3;
            transition: all 0.5s ease;
        }

        .step-item.active {
            opacity: 1;
            transform: translateX(10px);
        }

        .step-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            transition: background 0.3s;
        }

        .step-item.active .step-icon {
            background: #2E2E2E;
        }

        .step-text {
            font-size: 15px;
            font-weight: 500;
        }

        .progress-bar {
            height: 6px;
            background: #ccc;
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2E2E2E;
            transition: width 0.5s ease;
        }
        
        .status-text {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

<header class="processing-header">
    <img src="images/logo-icon.png" alt="CELMA" class="processing-logo">
</header>

<section class="processing-section">
    <div class="processing-card">
        <div class="ai-brain">🧠</div>
        <h2 id="main-title">Анализируем ваш отчёт</h2>

        <div class="steps-container">
            <div class="step-item" id="step1">
                <div class="step-icon">1</div>
                <div class="step-text">Загрузка данных в нейросеть...</div>
            </div>
            <div class="step-item" id="step2">
                <div class="step-icon">2</div>
                <div class="step-text">Распознавание паттернов и аномалий...</div>
            </div>
            <div class="step-item" id="step3">
                <div class="step-icon">3</div>
                <div class="step-text">Построение прогнозов и дашбордов...</div>
            </div>
            <div class="step-item" id="step4">
                <div class="step-icon">4</div>
                <div class="step-text">Формирование рекомендаций...</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="status-text" id="statusText">Инициализация...</div>
    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // 1. Проверяем, есть ли данные
        const fileId = sessionStorage.getItem('celma_file_id');
        const analytics = sessionStorage.getItem('celma_analytics');
        
        if (!fileId) {
            document.getElementById('main-title').textContent = "❌ Ошибка: Нет данных";
            document.getElementById('statusText').textContent = "Вы не загрузили файл. Вернитесь на главную.";
            setTimeout(() => window.location.href = 'addFile.html', 3000);
            return;
        }

        console.log("🧠 Начало анализа файла:", fileId);

        // 2. Запускаем симуляцию работы AI (анимация шагов)
        const steps = [
            { id: 'step1', text: 'Чтение строк и колонок...' },
            { id: 'step2', text: 'Поиск сезонных трендов...' },
            { id: 'step3', text: 'Расчет ключевых показателей (KPI)...' },
            { id: 'step4', text: 'Генерация инсайтов...' }
        ];

        let currentStep = 0;
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');

        // Функция обновления шага
        function runStep() {
            if (currentStep < steps.length) {
                // Подсветка текущего шага
                document.querySelectorAll('.step-item').forEach(el => el.classList.remove('active'));
                const activeStep = document.getElementById(steps[currentStep].id);
                if(activeStep) activeStep.classList.add('active');
                
                // Текст статуса
                statusText.textContent = steps[currentStep].text;
                
                // Прогресс бар
                const progress = ((currentStep + 1) / steps.length) * 100;
                progressFill.style.width = `${progress}%`;

                currentStep++;
                setTimeout(runStep, 1200); // 1.2 секунды на шаг
            } else {
                // Все шаги пройдены
                statusText.textContent = "✅ Анализ завершен! Переход к результатам...";
                progressFill.style.width = '100%';
                
                // Небольшая пауза перед переходом
                setTimeout(() => {
                    console.log("🚀 Переход на dashboard.html");
                    window.location.href = 'dashboard.html';
                }, 800);
            }
        }

        // Запуск первого шага через небольшую паузу
        setTimeout(runStep, 500);

        // 3. (Опционально) Здесь можно отправить реальный запрос на бэкенд для глубокого анализа
        // fetch(`${API_URL}/ai/deep-analyze`, { method: 'POST', body: JSON.stringify({file_id: fileId}) })
        // .then(res => res.json())
        // .then(data => {
        //     console.log("Глубокий анализ готов:", data);
        //     sessionStorage.setItem('celma_ai_result', JSON.stringify(data));
        // });
    });
</script>

</body>
</html>
